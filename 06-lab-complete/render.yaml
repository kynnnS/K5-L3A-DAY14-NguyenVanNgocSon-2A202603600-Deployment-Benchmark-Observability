# Render Blueprint — phương án thay thế cho railway.toml.
# Đường dẫn tính từ gốc repo vì code nằm trong thư mục con 06-lab-complete/.
# Render cấp PORT (mặc định 10000); Dockerfile CMD đã lắng nghe ${PORT:-8000}.
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh secret, không ghi giá trị trong repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue                   # Redis-compatible (Render Key Value)
    name: day14-redis
    plan: free
    ipAllowList: []                  # chỉ cho kết nối nội bộ từ service trên Render
    maxmemoryPolicy: noeviction
