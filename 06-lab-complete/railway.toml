# Railway — deploy thư mục 06-lab-complete/ (cd 06-lab-complete && railway up)
# Secret (AGENT_API_KEY) và REDIS_URL đặt trong tab Variables của service, không ghi ở đây.
# Railway cấp biến PORT; Dockerfile CMD đã lắng nghe ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
